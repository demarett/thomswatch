server {
  listen 8080;
  root /usr/share/nginx/html;
  resolver 127.0.0.11 valid=10s ipv6=off;
  location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
  location /api/ {
    set $backend_host backend;
    proxy_pass http://$backend_host:8080$request_uri;
    proxy_set_header Host $host;
  }
  location = /index.html { add_header Cache-Control "no-store, no-cache, must-revalidate" always; }
  location ~* \.(?:js|css)$ { add_header Cache-Control "no-cache, must-revalidate" always; try_files $uri =404; }
  location / { add_header Cache-Control "no-store" always; try_files $uri $uri/ /index.html; }
}
