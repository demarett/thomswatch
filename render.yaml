services:
  - type: web
    name: thomswatch-api-demarett
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://demarett.github.io
      - key: OVERFAST_BASE_URL
        value: https://overfast-api.tekrop.fr
      - key: OVERFAST_CACHE_MINUTES
        value: "10"
      - key: OVERFAST_CONNECT_TIMEOUT
        value: 5s
      - key: OVERFAST_READ_TIMEOUT
        value: 25s
      - key: JAVA_TOOL_OPTIONS
        value: -Xms64m -Xmx320m -XX:+UseSerialGC
