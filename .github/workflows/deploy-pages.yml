name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build -- --configuration production --base-href "/${{ github.event.repository.name }}/"

      - name: Configure backend URL
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: >-
          node -e 'const fs=require("node:fs"); const url=(process.env.API_BASE_URL ?? "").trim().replace(/\/+$/, "");
          if (!/^https:\/\//.test(url)) throw new Error("Configure the API_BASE_URL repository variable with the HTTPS Render URL");
          fs.writeFileSync("dist/thomswatch/browser/config.js", `window.__THOMSWATCH_CONFIG__ = ${JSON.stringify({apiBaseUrl:url})};\n`);'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist/thomswatch/browser

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
